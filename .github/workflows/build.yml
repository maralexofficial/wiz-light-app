name: Build Smart Home App

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Validate Smart Home App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Diagnose Repository Structure
        run: |
          echo "=== Diagnose Verzeichnisstruktur ==="
          pwd
          ls -la
          echo "--- Suche nach package.json ---"
          find . -maxdepth 3 -name "package.json" -not -path "*/node_modules/*" || true

      - name: Determine Application Directory
        id: locate
        run: |
          echo "=== Bestimme Anwendungsverzeichnis ==="
          TARGET_DIR=""

          if [ -f "package.json" ]; then
            TARGET_DIR="."
            echo "Gefunden: package.json im Stammverzeichnis."
          elif [ -f "web/package.json" ]; then
            TARGET_DIR="web"
            echo "Gefunden: package.json im Verzeichnis 'web'."
          elif [ -f "client/package.json" ]; then
            TARGET_DIR="client"
            echo "Gefunden: package.json im Verzeichnis 'client'."
          elif [ -f "frontend/package.json" ]; then
            TARGET_DIR="frontend"
            echo "Gefunden: package.json im Verzeichnis 'frontend'."
          else
            FOUND_FILE=$(find . -maxdepth 3 -name "package.json" -not -path "*/node_modules/*" | head -n 1)
            if [ -n "$FOUND_FILE" ]; then
              TARGET_DIR=$(dirname "$FOUND_FILE")
              echo "Gefunden: package.json in '$TARGET_DIR'."
            fi
          fi

          if [ -z "$TARGET_DIR" ] || [ ! -f "$TARGET_DIR/package.json" ]; then
            echo "::error::FEHLER: Keine package.json im Repository gefunden! Bitte stelle sicher, dass die Web-App vorhanden ist."
            exit 1
          fi

          echo "app_dir=$TARGET_DIR" >> "$GITHUB_OUTPUT"
          echo "Verwendetes Arbeitsverzeichnis: $TARGET_DIR"

      - name: Install Dependencies
        working-directory: ${{ steps.locate.outputs.app_dir }}
        run: |
          echo "=== Installiere Abhängigkeiten in ${{ steps.locate.outputs.app_dir }} ==="
          if [ -f "package-lock.json" ]; then
            echo "package-lock.json gefunden. Führe 'npm ci' aus..."
            npm ci
          else
            echo "Keine package-lock.json vorhanden. Führe 'npm install' aus..."
            npm install
          fi

      - name: Build Application
        working-directory: ${{ steps.locate.outputs.app_dir }}
        run: |
          echo "=== Baue Anwendung in ${{ steps.locate.outputs.app_dir }} ==="
          npm run build

      - name: Verify Build Artifacts
        id: verify
        run: |
          echo "=== Prüfe Build-Ergebnis ==="
          APP_DIR="${{ steps.locate.outputs.app_dir }}"
          
          OUTPUT_DIR=""
          if [ -d "$APP_DIR/dist" ] && [ -f "$APP_DIR/dist/index.html" ]; then
            OUTPUT_DIR="$APP_DIR/dist"
          elif [ -d "web/dist" ] && [ -f "web/dist/index.html" ]; then
            OUTPUT_DIR="web/dist"
          elif [ -d "dist" ] && [ -f "dist/index.html" ]; then
            OUTPUT_DIR="dist"
          elif [ -d "$APP_DIR/build" ] && [ -f "$APP_DIR/build/index.html" ]; then
            OUTPUT_DIR="$APP_DIR/build"
          fi

          if [ -z "$OUTPUT_DIR" ]; then
            echo "::error::Build fehlgeschlagen: Erwartete Produktionsdateien (dist/index.html) wurden nicht gefunden!"
            ls -la "$APP_DIR" || true
            exit 1
          fi

          echo "Gültiges Produktions-Build gefunden in: $OUTPUT_DIR"
          ls -lh "$OUTPUT_DIR"
          echo "artifact_path=$OUTPUT_DIR" >> "$GITHUB_OUTPUT"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: smart-home-web-dist
          path: ${{ steps.verify.outputs.artifact_path }}
          retention-days: 14